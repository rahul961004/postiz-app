# Postiz Deployment Configuration for Render.com
# Copy this content and create render.yaml in the root of your forked Postiz repository

databases:
  - name: postiz-db
    databaseName: postiz
    user: postiz
    plan: free

services:
  - type: redis
    name: postiz-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: postiz-social
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postiz-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: postiz-redis
          property: connectionString

      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false

      - key: BACKEND_INTERNAL_URL
        value: http://localhost:3000

      - key: FRONTEND_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: ENCRYPT_KEY
        generateValue: true

      - key: POSTIZ_API_KEY
        generateValue: true

      - key: FACEBOOK_APP_ID
        sync: false

      - key: FACEBOOK_APP_SECRET
        sync: false

      - key: LINKEDIN_CLIENT_ID
        sync: false

      - key: LINKEDIN_CLIENT_SECRET
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: TIKTOK_CLIENT_KEY
        sync: false

      - key: TIKTOK_CLIENT_SECRET
        sync: false

      - key: TWITTER_API_KEY
        sync: false

      - key: TWITTER_API_SECRET
        sync: false
