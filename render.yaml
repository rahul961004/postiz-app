databases:
  - name: postiz-db
    databaseName: postiz
    user: postiz
    plan: free

services:
  - type: redis
    name: postiz-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: postiz-social
    runtime: image
    image:
      url: ghcr.io/gitroomhq/postiz-app:latest
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postiz-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: postiz-redis
          property: connectionString

      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: BACKEND_INTERNAL_URL
        value: http://localhost:5000

      - key: JWT_SECRET
        generateValue: true

      - key: UPLOAD_DIRECTORY
        value: /uploads

      - key: NEXT_PUBLIC_UPLOAD_DIRECTORY
        value: /uploads
